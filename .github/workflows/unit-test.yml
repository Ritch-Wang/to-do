name: CI/CD Pipeline

on:
  pull_request:
  push:
    branches: [ main ]

env:
  AWS_REGION : "ap-southeast-2"
  ROLE_TO_ASSUME: arn:aws:iam::495671352507:role/github

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: mydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myuser -d mydb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://myuser:testpassword@localhost:5432/mydb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create schema
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=testpassword psql -h localhost -U myuser -d mydb -c "
          CREATE TABLE IF NOT EXISTS todos (
              id SERIAL PRIMARY KEY,
              title TEXT NOT NULL
          );"

      - name: Run tests
        run: pytest

  deploy:
    runs-on: ubuntu-latest

    # 👇 THIS is the key part
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          role-session-name: samplerolesession
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Deploy CloudFormation
        run: |
          aws cloudformation deploy \
            --stack-name IAC \
            --template-file infra/sth.yaml \
            --capabilities CAPABILITY_NAMED_IAM